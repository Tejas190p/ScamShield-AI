<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScamShield AI - Security Dashboard</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; max-width: 1200px; margin: 0 auto; }
        header { margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
        h1 { font-size: 24px; color: var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
        .card h2 { font-size: 14px; color: var(--text-dim); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-val { font-size: 32px; font-weight: bold; color: var(--text); }
        .stat-label { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
        .matrix-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
        .matrix-cell { background: #0f172a; padding: 12px; border-radius: 6px; border: 1px solid var(--border); text-align: center; }
        .matrix-cell .val { font-size: 20px; font-weight: bold; }
        .matrix-cell .lbl { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
        textarea { width: 100%; height: 100px; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 12px; font-size: 14px; margin-bottom: 12px; resize: vertical; }
        button { background: var(--accent); color: #0f172a; font-weight: bold; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        button:hover { opacity: 0.9; }
        .result-box { margin-top: 16px; padding: 16px; border-radius: 6px; display: none; background: #0f172a; border: 1px solid var(--border); }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .badge-HIGH { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .badge-MEDIUM { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid var(--warning); }
        .badge-LOW, .badge-NO_OBVIOUS_INDICATORS { background: rgba(34, 197, 94, 0.2); color: var(--success); border: 1px solid var(--success); }
    </style>
</head>
<body>
    <header>
        <h1>🛡️ ScamShield AI Console</h1>
        <p style="color: var(--text-dim); font-size: 14px; margin-top: 4px;">Real-time scam detection engine & adversarial evaluation metrics</p>
    </header>

    <div class="grid">
        <div class="card">
            <h2>Model Performance</h2>
            <div style="display: flex; justify-content: space-between;">
                <div><div class="stat-val" id="f1-score">--%</div><div class="stat-label">F1 Score</div></div>
                <div><div class="stat-val" id="precision">--%</div><div class="stat-label">Precision</div></div>
                <div><div class="stat-val" id="recall">--%</div><div class="stat-label">Recall</div></div>
            </div>
        </div>

        <div class="card">
            <h2>Confusion Matrix</h2>
            <div class="matrix-grid">
                <div class="matrix-cell"><div class="val" style="color:var(--success)" id="cm-tp">-</div><div class="lbl">True Positives</div></div>
                <div class="matrix-cell"><div class="val" style="color:var(--danger)" id="cm-fp">-</div><div class="lbl">False Positives</div></div>
                <div class="matrix-cell"><div class="val" style="color:var(--warning)" id="cm-fn">-</div><div class="lbl">False Negatives</div></div>
                <div class="matrix-cell"><div class="val" id="cm-tn">-</div><div class="lbl">True Negatives</div></div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Live Scam Scanner</h2>
        <textarea id="msg-input" placeholder="Paste message, SMS, or email content here to analyze..."></textarea>
        <button onclick="scanMessage()">Scan Message</button>

        <div id="result" class="result-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span id="res-category" style="font-weight: bold; font-size: 16px;">Category</span>
                <span id="res-risk" class="badge">RISK</span>
            </div>
            <p id="res-explanation" style="color: var(--text-dim); font-size: 14px;"></p>
        </div>
    </div>

    <script>
        async function fetchMetrics() {
            try {
                const res = await fetch('/metrics');
                const data = await res.json();
                document.getElementById('f1-score').innerText = data.metrics.f1_score + '%';
                document.getElementById('precision').innerText = data.metrics.precision + '%';
                document.getElementById('recall').innerText = data.metrics.recall + '%';
                document.getElementById('cm-tp').innerText = data.confusion_matrix.tp;
                document.getElementById('cm-fp').innerText = data.confusion_matrix.fp;
                document.getElementById('cm-fn').innerText = data.confusion_matrix.fn;
                document.getElementById('cm-tn').innerText = data.confusion_matrix.tn;
            } catch (e) { console.error('Metrics error:', e); }
        }

        async function scanMessage() {
            const message = document.getElementById('msg-input').value.trim();
            if (!message) return;
            try {
                const res = await fetch('/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                document.getElementById('result').style.display = 'block';
                document.getElementById('res-category').innerText = data.category;
                const badge = document.getElementById('res-risk');
                badge.innerText = data.risk_level;
                badge.className = 'badge badge-' + data.risk_level.replace(/\s+/g, '_');
                
                const reasons = data.reasons.map(r => '• ' + r.reason).join('<br>');
                document.getElementById('res-explanation').innerHTML = reasons || 'No obvious risk indicators detected.';
            } catch (e) { alert('Scan failed: ' + e); }
        }

        fetchMetrics();
    </script>
</body>
</html>
